<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Chain Reaction Simulation</title>
    <link rel="stylesheet" href="css/style.css">
    <!--to load icons from cdn-->
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
    crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!--to load p5js library-->
    <script src="js/p5.js"></script>
    <script src="js/addons/p5.sound.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
</head>
<body>
    <div class="title">
        <h1>Nuclear fission reaction simulation</h1>
    </div>
    <!--main container which will show flexbox layout-->
    <div id="main-container">
        <div id="sim-container"></div>

        <div class="controls-container">
        <div class="controls-1">
            <!-- <button class="play-btn" style="background-color: rgb(3, 152, 3); border-color: rgb(3, 152, 3)">Fire</button>  -->
            <button class="play-btn"><i class="fa-solid fa-play"></i></button>
            <button class="pause-btn"><i class="fa-solid fa-pause"></i></button>
            <button class="forward-btn"><i class="fa-solid fa-forward"></i></button>
            <button class="reset-btn">Reset</button>
        </div>
        
        <div class="controls-2">
            <div> No of nuclei: <input type="number" min="0" max="10" value="1" class="box" id="nuclei-input"></div>
            <input type="range" min="0" max="10" value="1" id="nuclei-range" class="slider">
        </div>

        <!-- <div class="controls-3">
            <div>
                <div style="padding-right:10px;" class="fissioned-percentage">Fissioned: <input type="number" min="0" max="100" class="box"></input> </div>
                <div class="probabilty">Probabilty of reaction: <input type="number" min="0" max="100" class="box"></input> </div>
            </div>

            <div> Uranium-238: <input type="number" min="0" max="10" value="0" class="box" id="isotope-input"></div>
            <input type="range" min="0" max="10" value="1" id="isotope-range" class="slider">

            <label for="graph"> Energy Graph 
            <input type="checkbox" id="graph" name="graph"></label>
        </div> -->

        <!-- <canvas id="myChart" style="width:50%;max-width:200px"></canvas> -->



        </div>
    </div>
    <!--To load the icons and link the external javascript file-->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>

    <script src="sketch.js"></script>
    <script src="particle.js"></script>
</body>
</html>
